name: APEX Prod Verify

on:
  push:
    branches: [main]
    paths:
      - "apex-ui/**"
      - ".github/workflows/apex-prod-verify.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apex-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run deploy service smoke (optional env)
        env:
          ALPHA_AI_SERVICE_URL: ${{ secrets.ALPHA_AI_SERVICE_URL }}
          KITE_ORDER_PROXY_URL: ${{ secrets.KITE_ORDER_PROXY_URL }}
        run: npm run verify:deploy

      - name: Run production smoke checks
        env:
          APEX_VERIFY_BASE_URL: https://apex-ten-kappa.vercel.app
          APEX_VERIFY_COOKIE: ${{ secrets.APEX_VERIFY_COOKIE }}
        run: npm run verify:prod

  e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apex-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke against production
        env:
          PLAYWRIGHT_BASE_URL: https://apex-ten-kappa.vercel.app
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npm run test:e2e

  e2e-authed:
    runs-on: ubuntu-latest
    if: ${{ secrets.APEX_E2E_COOKIE != '' }}
    defaults:
      run:
        working-directory: apex-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apex-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run authenticated E2E against production
        env:
          PLAYWRIGHT_BASE_URL: https://apex-ten-kappa.vercel.app
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          APEX_E2E_COOKIE: ${{ secrets.APEX_E2E_COOKIE }}
        run: npx playwright test e2e/authed.spec.ts
