# Fly.io — Kite order proxy (~$8–10/mo: VM + inbound v4 + static egress)
# Deploy from this directory: ./setup-fly.sh
app = "apex-kite-order-proxy"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3128"

[[services]]
  protocol = "tcp"
  internal_port = 3128
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3128

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
